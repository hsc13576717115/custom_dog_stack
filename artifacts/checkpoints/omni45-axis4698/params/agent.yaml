seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 100
empirical_normalization: false
obs_groups: {}
clip_actions: null
save_interval: 20
experiment_name: custom_dog_velocity
run_name: speed_omni_axis45_from4599_100
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-08-10_13-44-39_speed_omni_style45_from4500_100
load_checkpoint: model_4599.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
  noise_std_type: scalar
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 3
  num_mini_batches: 4
  learning_rate: 3.0e-05
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0005
  desired_kl: 0.003
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: custom_dog_rl.tasks.locomotion.mdp.symmetry:compute_symmetric_states
    mirror_loss_coeff: 0.0
