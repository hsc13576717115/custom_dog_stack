schema_version: 1
validated: false
baud_rate: 4000000

# RL uses a joint-side position target. Keep these values synchronized with
# the Isaac actuator and the selected candidate's deploy.yaml.
rl_position_control:
  stiffness: 25.0
  damping: 0.5
  base_gear_ratio: 6.33
  calf_total_gear_ratio: 12.66
  # GO-M8010-6 SDK motor-side gains are joint-side gains / gear_ratio^2.
  convert_gains_to_motor_side: true

# One RS485 bus per leg. Device names, IDs, directions and zero offsets must be
# measured on the actual Orin NX before this file is enabled.
buses:
  FR:
    device: /dev/ttyUSB0
    motors:
      - {joint: FR_hip_joint, motor_id: 0, direction: 1, zero_offset: null}
      - {joint: FR_thigh_joint, motor_id: 1, direction: 1, zero_offset: null}
      - {joint: FR_calf_joint, motor_id: 2, direction: 1, zero_offset: null}
  FL:
    device: /dev/ttyUSB1
    motors:
      - {joint: FL_hip_joint, motor_id: 0, direction: 1, zero_offset: null}
      - {joint: FL_thigh_joint, motor_id: 1, direction: 1, zero_offset: null}
      - {joint: FL_calf_joint, motor_id: 2, direction: 1, zero_offset: null}
  RR:
    device: /dev/ttyUSB2
    motors:
      - {joint: RR_hip_joint, motor_id: 0, direction: 1, zero_offset: null}
      - {joint: RR_thigh_joint, motor_id: 1, direction: 1, zero_offset: null}
      - {joint: RR_calf_joint, motor_id: 2, direction: 1, zero_offset: null}
  RL:
    device: /dev/ttyUSB3
    motors:
      - {joint: RL_hip_joint, motor_id: 0, direction: 1, zero_offset: null}
      - {joint: RL_thigh_joint, motor_id: 1, direction: 1, zero_offset: null}
      - {joint: RL_calf_joint, motor_id: 2, direction: 1, zero_offset: null}
